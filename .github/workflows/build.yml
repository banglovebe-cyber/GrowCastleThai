              <path android:pathData="M12,3L22,21L2,21ZM12,10v5M12,18h0.01" android:strokeColor="#ffd24a" android:strokeWidth="2" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000"/>
          </vector>
          __EOF__
          mkdir -p "$(dirname "app/src/main/res/drawable/ic_castle.xml")"
          cat > "app/src/main/res/drawable/ic_castle.xml" <<'__EOF__'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="150dp" android:height="122dp" android:viewportWidth="160" android:viewportHeight="130">
                  <path android:fillColor="#2a6b2a" android:pathData="M0,125h160v5h-160z"/>
                  <path android:fillColor="#c9d4ea" android:strokeColor="#2b3550" android:strokeWidth="3" android:strokeLineJoin="round" android:pathData="M30,125V50h-6V36h10v6h8v-6h8v6h8v-6h10v14h-6v75z"/>
                  <path android:fillColor="#c9d4ea" android:strokeColor="#2b3550" android:strokeWidth="3" android:strokeLineJoin="round" android:pathData="M100,125V50h-6V36h10v6h8v-6h8v6h8v-6h10v14h-6v75z"/>
                  <path android:fillColor="#dbe4f5" android:strokeColor="#2b3550" android:strokeWidth="3" android:strokeLineJoin="round" android:pathData="M58,125V52h-6V36h10v6h8v-6h8v6h8v-6h10v16h-6v73z"/>
                  <path android:fillColor="#4a2a10" android:strokeColor="#2b3550" android:strokeWidth="3" android:pathData="M62,125v-26a12,12 0 0 1 24,0v26z"/>

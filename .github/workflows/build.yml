                  <path android:fillColor="#dbe4f5" android:strokeColor="#2b3550" android:strokeWidth="3" android:strokeLineJoin="round" android:pathData="M58,125V52h-6V36h10v6h8v-6h8v6h8v-6h10v16h-6v73z"/>
                  <path android:fillColor="#4a2a10" android:strokeColor="#2b3550" android:strokeWidth="3" android:pathData="M62,125v-26a12,12 0 0 1 24,0v26z"/>
                  <path android:strokeColor="#2b3550" android:strokeWidth="3" android:pathData="M74,6L74,34"/>

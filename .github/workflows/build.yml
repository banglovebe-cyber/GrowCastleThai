          </vector>
          __EOF__
          mkdir -p "$(dirname "app/src/main/res/drawable/ic_check.xml")"
          cat > "app/src/main/res/drawable/ic_check.xml" <<'__EOF__'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:pathData="M4,12l5,5L20,6" android:strokeColor="#5fd35a" android:strokeWidth="2" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000"/>
          </vector>
          __EOF__
          mkdir -p "$(dirname "app/src/main/res/drawable/ic_download.xml")"
          cat > "app/src/main/res/drawable/ic_download.xml" <<'__EOF__'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:pathData="M12,3v12M12,15l-4,-4M12,15l4,-4M4,20h16" android:strokeColor="#FFFFFF" android:strokeWidth="2" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000"/>
          </vector>
          __EOF__
          mkdir -p "$(dirname "app/src/main/res/drawable/ic_launcher_fg.xml")"
          cat > "app/src/main/res/drawable/ic_launcher_fg.xml" <<'__EOF__'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <group android:scaleX="0.34" android:scaleY="0.34" android:translateX="27" android:translateY="30">
                  <path android:fillColor="#2a6b2a" android:pathData="M0,125h160v5h-160z"/>
                  <path android:fillColor="#c9d4ea" android:strokeColor="#2b3550" android:strokeWidth="3" android:strokeLineJoin="round" android:pathData="M30,125V50h-6V36h10v6h8v-6h8v6h8v-6h10v14h-6v75z"/>
